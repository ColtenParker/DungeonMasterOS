services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: dmos
      POSTGRES_PASSWORD: dmos
      POSTGRES_DB: dmos
    ports:
      - "5432:5432"
    volumes:
      - dmos-postgres:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dmos -d dmos"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dmos-postgres:
