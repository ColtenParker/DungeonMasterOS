services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dmos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dmos}
      POSTGRES_DB: ${POSTGRES_DB:-dmos}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - dmos-postgres:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "PGPASSWORD=$$POSTGRES_PASSWORD psql --host=127.0.0.1 --username=$$POSTGRES_USER --dbname=$$POSTGRES_DB --no-password --tuples-only --command='SELECT 1' | grep -q 1",
        ]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s
    stop_grace_period: 10s

volumes:
  dmos-postgres:
